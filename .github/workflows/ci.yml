name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar lint
        run: |
          python -m pylint src --disable=C0114,C0115,C0116,C0301,C0304
          python -m pylint tests --disable=C0114,C0115,C0116,C0301,C0304

      - name: Executar testes
        env:
          PYTHONPATH: .
        run: |
          pytest -v